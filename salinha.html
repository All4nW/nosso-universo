<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Nossa Salinha 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,600&family=DM+Sans:wght@400;500&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/salinha.css?v=4">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="lights"></div><div class="cap">✦ nossa salinha ✦</div><div class="moon"></div>

<div class="who" id="who">
  <h1>Quem está entrando?</h1>
  <button class="pill" data-r="a">Sou o Allan</button>
  <button class="pill" data-r="b">Sou a Jhennyfer</button>
</div>

<div id="toast" role="status"></div>

<main class="stage">
  <div class="screen" id="screen">
    <video id="pv" muted playsinline></video>
    <video id="vid" playsinline></video>
    <div class="bar"><button class="pill" id="bPrev">👁 Preview</button><button class="pill" id="bStop2">Parar</button></div>
    <div class="wait" id="wait"></div>
    <button class="pill" id="snd" hidden>🔊 Ativar som</button>
    <button id="bFs" type="button" title="Tela cheia" aria-label="Tela cheia"></button>
    <button id="peek" type="button" aria-label="Abrir chat"></button>
  </div>
  <p class="rot">↻ Deite o celular para ver em tela cheia</p>
</main>

<section class="pad" id="pad" aria-label="Chat">
  <i class="fl f1">🌸</i><i class="fl f2">🌼</i>
  <header><h3>Chat</h3><button class="x" id="padX" aria-label="Fechar chat">✕</button></header>
  <div id="msgs"></div>
   <div class="tray emo" id="emo">
    <div class="etop"><button type="button" class="on" data-p="emoPane">😊 Emojis</button><button type="button" data-p="stkPane">🎟 Figurinhas</button></div>
    <div id="emoPane"></div>
    <div id="stkPane" hidden>
      <div class="sg-secao">
        <p class="sg-titulo">⭐ Mais usadas</p>
        <div class="sg" id="sgTop"></div>
      </div>
      <div class="sg-secao">
        <p class="sg-titulo">Todas as figurinhas</p>
        <div class="sg" id="sgAll"></div>
      </div>
    </div>
  </div>
  <div class="tray att" id="att"><button type="button" id="aGal">🖼 Galeria</button><button type="button" id="aCam">📷 Tirar foto</button></div>
  <div class="say">
    <div class="field"><input id="txt" maxlength="500" placeholder="Escreve aqui…" autocomplete="off"><button id="bAtt" type="button" aria-label="Enviar imagem">🖼</button><button id="bEmo" type="button" aria-label="Emojis">😊</button></div>
    <button id="send" type="button" aria-label="Enviar">➤</button>
  </div>
  <input type="file" id="fGal" accept="image/*" hidden><input type="file" id="fCam" accept="image/*" capture="environment" hidden>
</section>
<div id="lb"><img id="lbi" alt=""></div>

<footer class="base">
 <div class="seat" id="seatMe" data-s="re"><div class="av" id="avMe"></div><small id="stMe"></small><b id="nmMe"></b></div>
  <nav class="ctrl">
    <button id="bChat" title="Chat" aria-label="Chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg><span id="dot"></span></button>
    <button id="bSet" title="Configurações" aria-label="Configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
    <button id="bPip" title="Janela flutuante" aria-label="Janela flutuante"></button>
    <button id="bExit" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4h9v17M3 21h18"/><circle cx="12.5" cy="12.5" r=".8"/></svg></button>
  </nav>
<div class="seat o" id="seatO" data-s="off"><div class="av" id="avO"></div><small id="stO"></small><b id="nmO"></b></div>
</footer>

<dialog id="dlg">
  <i class="dfl a">🌸</i><i class="dfl b">🌸</i>
  <div class="dh"><span class="tic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M12 4c2 2 2 4 0 6-2-2-2-4 0-6zM12 20c-2-2-2-4 0-6 2 2 2 4 0 6zM4 12c2-2 4-2 6 0-2 2-4 2-6 0zM20 12c-2 2-4 2-6 0 2-2 4-2 6 0z"/></svg></span><h3>Configurações</h3><button class="xx" id="cX" type="button" aria-label="Fechar">✕</button></div>
  <button class="chip back" id="cWho" type="button">‹ Trocar quem sou</button>
  <div class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg><div><span class="ft">Seu nome</span><div class="inp"><input id="cMy" maxlength="20" autocomplete="off"><em id="cCount">0/20</em></div></div></div>
  <div class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M5 17l5-4 3 3 3-2 3 3"/></svg><div><span class="ft">Seu avatar</span><button class="drop" id="cPick" type="button"><span class="prev" id="cPrev"></span><span><b>Selecionar imagem</b><small>Escolha uma foto da sua galeria</small></span></button><input type="file" id="cFile" accept="image/*" hidden></div></div>
  <div class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.8"/><path d="M8 8a5.7 5.7 0 0 0 0 8M16 8a5.7 5.7 0 0 1 0 8M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13"/></svg><div><span class="ft">Transmissão</span><select id="cQ"><option value="motion">Filme ou jogo (fluido)</option><option value="detail">Texto e imagem (nítido)</option></select></div></div>
  <div class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="17" height="11" rx="3"/><path d="M7.5 10v4M7.5 12h3M10.5 10v4M13.5 10v4h1.5a2 2 0 0 0 0-4h-1.5"/></svg><div><span class="ft">Qualidade máxima</span><select id="cB"><option value="6">Econômica · 6 Mbps</option><option value="10">Alta · 10 Mbps</option><option value="16">Máxima · 16 Mbps</option></select></div></div>
  <div class="fld"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="3"/><path d="M5 15V8a3 3 0 0 1 3-3h7"/></svg><div><span class="ft">Quadros por segundo</span><select id="cF"><option value="30">30 FPS</option><option value="60">60 FPS</option></select></div></div>
  <div class="row2"><button class="chip" id="cCancel" type="button">Cancelar</button><button class="chip go" id="cOk" type="button">Salvar ✦</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="js/salinha.js?v=4"></script>
</body>
</html>
