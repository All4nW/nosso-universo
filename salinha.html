<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Salinha 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0713;--plum:#2a1640;--velvet:#5b2f7e;--velvet2:#3d1d5a;--rose:#ff8fc7;--lilac:#c9a8ff;--paper:#f6e9ff;--ink:#e9dcf7;
--ui:'Quicksand','Segoe UI',system-ui,sans-serif;--hand:'Caveat','Segoe Print','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#1d0f2e 0%,var(--bg) 60%);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden;
padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* tela de cinema */
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:14px 14px 0}
.screen{position:relative;aspect-ratio:16/9;width:min(100%,calc((100dvh - 190px)*16/9));background:#050308;border-radius:14px;
border:7px solid #1a1026;box-shadow:0 0 0 1px #3a2352,0 0 60px rgba(190,110,255,.16),0 0 120px rgba(255,120,190,.08),inset 0 0 40px rgba(0,0,0,.8);overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .6s}
.screen.live video{opacity:1}
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;transition:opacity .5s}
.screen.live .wait,.screen.prev .wait{opacity:0;pointer-events:none}
#pv{opacity:0}
.screen.prev #pv{opacity:1}
.bar{position:absolute;left:10px;top:10px;z-index:3;display:none;gap:8px}
.screen.sharing .bar{display:flex}
.bar .pill{padding:5px 12px;font-size:13px;background:rgba(12,7,19,.7);backdrop-filter:blur(6px)}
.wait::before{content:"";position:absolute;inset:-30%;background:radial-gradient(40% 40% at 50% 40%,rgba(200,120,255,.18),transparent 70%);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(8%,6%) scale(1.15)}}
.wait>*{position:relative}
.wait h2{font-family:var(--hand);font-weight:700;font-size:clamp(22px,4.2vw,40px);color:var(--paper)}
.wait p{font-size:clamp(12px,1.8vw,15px);opacity:.65;max-width:34ch}
.pill{background:rgba(255,143,199,.14);border:1px solid rgba(255,143,199,.45);color:var(--paper);padding:8px 18px;border-radius:99px;font-weight:600;transition:background .2s}
.pill:hover{background:rgba(255,143,199,.28)}
#snd{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(12,7,19,.7);backdrop-filter:blur(6px)}
#snd[hidden]{display:none}

/* base: poltronas + controles */
.base{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:6px 18px 12px;gap:10px;height:150px}
.seat{display:flex;flex-direction:column;align-items:center;width:104px;transition:filter .5s,opacity .5s}
.seat.o{justify-self:end}
.av{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.07);margin-bottom:-24px}
.chair{position:relative;width:88px;height:56px;border-radius:24px 24px 10px 10px;background:linear-gradient(var(--velvet),var(--velvet2));box-shadow:inset 0 -10px 0 rgba(0,0,0,.2);z-index:2}
.chair::before,.chair::after{content:"";position:absolute;bottom:0;width:17px;height:38px;border-radius:10px;background:#4b2569}
.chair::before{left:-9px}.chair::after{right:-9px}
.seat small{font-size:11px;opacity:.75;margin-top:4px}
.seat b{font-family:var(--hand);font-size:18px;font-weight:700;line-height:1}
.seat[data-s=off]{filter:grayscale(1);opacity:.42}
.seat[data-s=re]{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
.seat.pop .av{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translateY(30px) scale(.6)}60%{transform:translateY(-10px) scale(1.15)}100%{transform:none}}
.ctrl{display:flex;gap:10px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.ctrl button{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.07);font-size:20px;transition:transform .15s,background .2s}
.ctrl button:hover{background:rgba(255,143,199,.25);transform:translateY(-2px)}
#dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--rose);display:none}
#dot.on{display:block}

/* aviso discreto */
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0));left:50%;transform:translate(-50%,-30px);opacity:0;background:rgba(40,22,60,.85);backdrop-filter:blur(8px);
border:1px solid rgba(201,168,255,.3);padding:7px 16px;border-radius:99px;font-size:13px;transition:.4s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* caderninho */
.pad{position:fixed;right:16px;bottom:158px;width:310px;max-height:min(52dvh,420px);display:none;flex-direction:column;z-index:10;
background:repeating-linear-gradient(transparent 0 27px,rgba(255,255,255,.05) 27px 28px),rgba(38,20,58,.78);backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.12);border-radius:10px 18px 18px 10px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:20px 14px 12px 26px;transform:rotate(-.6deg)}
.pad.open{display:flex;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(12px) rotate(-.6deg)}}
.pad::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:20px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,143,199,.5);border-radius:3px}
.pad::after{content:"";position:absolute;left:8px;top:22px;bottom:22px;width:6px;background:radial-gradient(circle,rgba(255,255,255,.3) 2.5px,transparent 3px) 0 0/6px 22px repeat-y}
.pad h3{font-family:var(--hand);font-size:22px;color:var(--paper);margin-bottom:6px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 4px 8px 0;min-height:90px}
.m{max-width:82%;padding:5px 12px;border-radius:16px;font-family:var(--hand);font-size:19px;line-height:1.15;word-wrap:break-word;background:rgba(201,168,255,.18);border:1px solid rgba(201,168,255,.25);align-self:flex-start;border-bottom-left-radius:5px}
.m.me{align-self:flex-end;background:rgba(255,143,199,.2);border-color:rgba(255,143,199,.32);border-radius:16px;border-bottom-right-radius:5px}
.say{display:flex;gap:6px;border-top:1px dashed rgba(255,255,255,.18);padding-top:8px}
.say input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.25);padding:4px 2px;font-family:var(--hand);font-size:19px}
.say button{background:none;border:0;font-size:18px}

/* configurações */
dialog{margin:auto;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:#1d0f2e;color:var(--ink);padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(5,2,10,.7)}
dialog h3{font-family:var(--hand);font-size:26px;margin-bottom:10px}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0;font-size:14px}
dialog select,dialog input{background:#2a1640;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 8px;max-width:170px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
dialog .hint{font-size:12px;opacity:.6;margin-top:6px}
.who{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.who.on{display:flex}
.who h1{font-family:var(--hand);font-size:38px}

@media (max-width:560px){
 .pad{left:10px;right:10px;width:auto;bottom:150px}
 .base{padding:4px 8px 10px;gap:4px}
 .seat{width:84px}.chair{width:72px;height:48px}.av{width:46px;height:46px;font-size:26px}
 .ctrl{gap:6px;padding:6px 8px}.ctrl button{width:40px;height:40px}
}
@media (max-height:520px){
 .base{height:96px}.screen{width:min(100%,calc((100dvh - 120px)*16/9))}
 .seat small,.seat b{display:none}.av{width:38px;height:38px;font-size:22px;margin-bottom:-18px}.chair{height:38px;width:64px}
 .pad{bottom:104px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="who" id="who">
  <h1>Quem está entrando?</h1>
  <button class="pill" data-r="a">Sou eu</button>
  <button class="pill" data-r="b">Sou a Jhennyfer</button>
</div>

<div id="toast" role="status"></div>

<main class="stage">
  <div class="screen" id="screen">
    <video id="pv" muted playsinline></video>
    <video id="vid" playsinline></video>
    <div class="bar"><button class="pill" id="bPrev">👁 Preview</button><button class="pill" id="bStop2">Parar</button></div>
    <div class="wait" id="wait"></div>
    <button class="pill" id="snd" hidden>🔊 Ativar som</button>
  </div>
</main>

<section class="pad" id="pad" aria-label="Chat">
  <h3>caderninho 💜</h3>
  <div id="msgs"></div>
  <div class="say"><input id="txt" maxlength="500" placeholder="escreve aqui…" autocomplete="off"><button id="send" aria-label="Enviar">✦</button></div>
</section>

<footer class="base">
  <div class="seat" id="seatMe" data-s="re"><div class="av" id="avMe"></div><div class="chair"></div><small id="stMe"></small><b id="nmMe"></b></div>
  <nav class="ctrl">
    <button id="bChat" title="Chat" aria-label="Chat">💬<span id="dot"></span></button>
    <button id="bSet" title="Configurações" aria-label="Configurações">⚙️</button>
    <button id="bExit" title="Sair" aria-label="Sair">🚪</button>
  </nav>
  <div class="seat o" id="seatO" data-s="off"><div class="av" id="avO"></div><div class="chair"></div><small id="stO"></small><b id="nmO"></b></div>
</footer>

<dialog id="dlg">
  <h3>Configurações</h3>
  <label>Seu nome <input id="cMy" maxlength="14"></label>
  <label>Seu avatar <select id="cMyAv"></select></label>
  <label>Nome do outro <input id="cO" maxlength="14"></label>
  <label>Avatar do outro <select id="cOAv"></select></label>
  <label>Transmissão
    <select id="cQ"><option value="motion">Filme ou jogo (fluidez)</option><option value="detail">Texto e imagem (nitidez)</option></select></label>
  <label>Qualidade máxima
    <select id="cB"><option value="4">4 Mbps</option><option value="8">8 Mbps</option><option value="12">12 Mbps</option></select></label>
  <label>Quadros por segundo
    <select id="cF"><option value="30">30</option><option value="60">60</option></select></label>
  <p class="hint">Qualidade e quadros valem para quem transmite e se aplicam na hora.</p>
  <div class="row">
    <button class="pill" id="cWho">Trocar quem sou</button>
    <button class="pill" id="cOk">Pronto</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
/* ===== CÓDIGO FIXO DA SALINHA ===== troque por algo só de vocês (só letras minúsculas e números) */
const SALA = 'nu-salinha-k7q2x9';

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('nu:' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('nu:' + k, JSON.stringify(v)); }catch(e){} }
};
const AVATARS = ['🐻','🐰','🐱','🦊','🐼','🐸','🐥','🌙','⭐','🍓'];

let role = new URLSearchParams(location.search).get('eu');
if (role === 'a' || role === 'b') store.set('role', role); else role = store.get('role', null);

let cfg, myId, otherId;
let peer = null, conn = null, call = null, localStream = null;
let everSeen = false, meLost = false, leaving = false, lastSeen = 0, dialAt = 0, tt;
const canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

/* ---------- interface ---------- */
function toast(t){ const d = $('toast'); d.textContent = t; d.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => d.classList.remove('show'), 3200); }
function setSeat(w, s){ $('seat' + w).dataset.s = s; $('st' + w).textContent = {on:'aqui', off:'fora', re:'reconectando…'}[s]; }
function pop(w){ const e = $('seat' + w); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
function paintNames(){
  $('nmMe').textContent = cfg.myName; $('avMe').textContent = cfg.myAv;
  $('nmO').textContent = cfg.otherName; $('avO').textContent = cfg.otherAv;
}
function renderWait(){
  const live = $('screen').classList.contains('live');
  let h = '';
  if (localStream) h = '<h2>Você está transmitindo ✨</h2><p>Preview escondido. Quem está na sala vê a sua tela.</p>';
  else if (!live){
    h = '<h2>A sessão ainda não começou</h2><p>Quando alguém transmitir, a tela acende aqui.</p>';
    if (canShare) h += '<button class="pill" id="bShare">Transmitir minha tela</button>';
  }
  $('wait').innerHTML = h;
  if ($('bStop')) $('bStop').onclick = stopShare;
  if ($('bShare')) $('bShare').onclick = share;
  updPrev();
}
let prevOn = true;
function updPrev(){
  const sc = $('screen'), pv = $('pv'), on = !!localStream;
  sc.classList.toggle('sharing', on);
  sc.classList.toggle('prev', on && prevOn);
  if (on){ if (pv.srcObject !== localStream) pv.srcObject = localStream; pv.play().catch(() => {}); }
  else pv.srcObject = null;
}

/* ---------- chat ---------- */
let msgs = [];
function addMsg(from, text, save = true){
  const d = document.createElement('div'); d.className = 'm' + (from === 'me' ? ' me' : ''); d.textContent = text;
  $('msgs').appendChild(d); $('msgs').scrollTop = 1e9;
  if (save){ msgs.push({from, text}); store.set('chat', msgs.slice(-60)); }
  if (from !== 'me' && !$('pad').classList.contains('open')) $('dot').classList.add('on');
}
function sendMsg(){
  const x = $('txt').value.trim(); if (!x) return;
  if (!conn || !conn.open){ toast('Sem conexão agora, tenta de novo já já'); return; }
  conn.send({t:'chat', x}); addMsg('me', x); $('txt').value = '';
}

/* ---------- qualidade ---------- */
function boost(sdp){
  const k = cfg.mbps * 1000;
  return sdp.replace(/(m=video[^\r\n]*\r\nc=[^\r\n]*\r\n)(b=[^\r\n]*\r\n)?/, '$1b=AS:' + k + '\r\n');
}
async function tune(c){
  const pc = c && c.peerConnection; if (!pc) return;
  for (const s of pc.getSenders()){
    if (!s.track || s.track.kind !== 'video') continue;
    try{
      s.track.contentHint = cfg.quality;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = cfg.mbps * 1e6;
      p.encodings[0].maxFramerate = cfg.fps;
      p.encodings[0].scaleResolutionDownBy = 1;
      p.degradationPreference = cfg.quality === 'detail' ? 'maintain-resolution' : 'maintain-framerate';
      await s.setParameters(p);
    }catch(e){}
  }
}

/* ---------- transmissão ---------- */
async function share(){
  try{
    const s = await navigator.mediaDevices.getDisplayMedia({
      video:{frameRate:{ideal:cfg.fps, max:cfg.fps}, width:{ideal:1920}, height:{ideal:1080}},
      audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
    });
    const vt = s.getVideoTracks()[0]; vt.contentHint = cfg.quality; vt.onended = stopShare;
    localStream = s; renderWait(); startCall();
  }catch(e){ toast('Transmissão cancelada'); }
}
function stopShare(){
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (call){ const c = call; call = null; try{ c.close(); }catch(e){} }
  renderWait();
}
function startCall(){
  if (!localStream || !conn || !conn.open || !peer || !peer.open) return;
  const c = peer.call(otherId, localStream, {sdpTransform: boost});
  setCall(c);
  [400, 2500, 7000].forEach(ms => setTimeout(() => { if (call === c) tune(c); }, ms));
  const pc = c.peerConnection;
  if (pc) pc.addEventListener('connectionstatechange', () => {
    if (pc.connectionState === 'failed' && call === c) setTimeout(startCall, 1500);
  });
}
function setCall(c){
  if (call && call !== c){ const o = call; call = null; try{ o.close(); }catch(e){} }
  call = c;
  c.on('stream', showRemote);
  c.on('close', () => { if (call === c){ call = null; hideRemote(); } });
  c.on('error', () => {});
}
const vid = $('vid');
function showRemote(st){
  vid.srcObject = st; vid.muted = false;
  vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); updSnd(); });
  $('screen').classList.add('live'); renderWait(); updSnd();
}
function hideRemote(){ vid.srcObject = null; $('screen').classList.remove('live'); renderWait(); updSnd(); }
function updSnd(){ $('snd').hidden = !($('screen').classList.contains('live') && vid.muted); }
vid.onvolumechange = updSnd;
$('snd').onclick = () => { vid.muted = false; vid.play().catch(() => {}); updSnd(); };
$('screen').ondblclick = () => {
  const f = $('screen');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (f.requestFullscreen) f.requestFullscreen();
  else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
};

/* ---------- conexão ---------- */
function refreshMe(){
  const ok = !!(peer && peer.open && !peer.disconnected && navigator.onLine);
  setSeat('Me', ok ? 'on' : 're');
  if (!ok && !meLost){ meLost = true; toast('Reconectando...'); }
  if (ok && meLost){ meLost = false; toast('Conectado novamente'); }
}
function setConn(c){
  if (conn && conn !== c){ const o = conn; conn = null; try{ o.close(); }catch(e){} }
  conn = c;
  const opened = () => {
    if (conn !== c) return;
    lastSeen = Date.now();
    const again = everSeen; everSeen = true;
    setSeat('O', 'on'); pop('O');
    toast(again ? 'Conectado novamente' : cfg.otherName + ' entrou 💜');
    if (localStream) startCall();
  };
  c.on('open', opened);
  c.on('data', d => { lastSeen = Date.now(); if (d && d.t === 'chat' && d.x) addMsg('o', String(d.x).slice(0, 500)); });
  c.on('close', () => dropConn(c));
  c.on('error', () => dropConn(c));
  if (c.open) opened();
}
function dropConn(c){
  try{ c.close(); }catch(e){}
  if (conn === c){
    conn = null;
    setSeat('O', everSeen ? 're' : 'off');
    if (everSeen) toast('Reconectando...');
  }
}
function start(){
  if (leaving) return;
  if (peer){ try{ peer.destroy(); }catch(e){} }
  peer = new Peer(myId, {config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}});
  peer.on('open', refreshMe);
  peer.on('disconnected', refreshMe);
  peer.on('connection', c => { if (c.peer !== otherId){ c.close(); return; } setConn(c); });
  peer.on('call', c => { if (c.peer !== otherId) return; c.answer(undefined, {sdpTransform: boost}); setCall(c); });
  peer.on('error', () => refreshMe());   /* o supervisor abaixo refaz a conexão */
  refreshMe();
}
/* supervisor: a cada 3s confere tudo e refaz o que caiu */
setInterval(() => {
  if (leaving || !role) return;
  if (!peer || peer.destroyed){ start(); return; }
  if (peer.disconnected && navigator.onLine){ try{ peer.reconnect(); }catch(e){} }
  refreshMe();
  if (conn && conn.open){
    try{ conn.send({t:'p'}); }catch(e){}
    if (Date.now() - lastSeen > 10000) dropConn(conn);
  } else if (role === 'a' && peer.open && Date.now() - dialAt > 6000){
    dialAt = Date.now(); setConn(peer.connect(otherId, {reliable:true}));
  }
}, 3000);
window.addEventListener('offline', refreshMe);
window.addEventListener('online', () => { if (peer && peer.disconnected){ try{ peer.reconnect(); }catch(e){} } refreshMe(); });

/* ---------- botões ---------- */
$('bChat').onclick = () => { $('pad').classList.toggle('open'); $('dot').classList.remove('on'); if ($('pad').classList.contains('open')) $('txt').focus(); };
$('send').onclick = sendMsg;
$('txt').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
$('bExit').onclick = () => { leaving = true; stopShare(); try{ peer && peer.destroy(); }catch(e){} location.href = 'index.html'; };
$('bSet').onclick = () => {
  $('cMy').value = cfg.myName; $('cMyAv').value = cfg.myAv; $('cO').value = cfg.otherName; $('cOAv').value = cfg.otherAv;
  $('cQ').value = cfg.quality; $('cB').value = cfg.mbps; $('cF').value = cfg.fps; $('dlg').showModal();
};
$('cOk').onclick = () => {
  cfg = {myName:$('cMy').value.trim() || 'Você', myAv:$('cMyAv').value, otherName:$('cO').value.trim() || 'Ela', otherAv:$('cOAv').value,
         quality:$('cQ').value, mbps:+$('cB').value, fps:+$('cF').value};
  store.set('cfg', cfg); paintNames(); $('dlg').close();
  if (localStream){ const vt = localStream.getVideoTracks()[0]; if (vt){ vt.contentHint = cfg.quality; vt.applyConstraints({frameRate:{ideal:cfg.fps, max:cfg.fps}}).catch(() => {}); } tune(call); }
};
$('bPrev').onclick = () => { prevOn = !prevOn; renderWait(); };
$('bStop2').onclick = stopShare;
$('cWho').onclick = () => { store.set('role', null); location.href = location.pathname; };
['cMyAv','cOAv'].forEach(id => AVATARS.forEach(a => { const o = document.createElement('option'); o.value = o.textContent = a; $(id).appendChild(o); }));

/* ---------- entrada ---------- */
function boot(){
  myId = SALA + '-' + role; otherId = SALA + '-' + (role === 'a' ? 'b' : 'a');
  cfg = Object.assign({myName:'Você', otherName: role === 'a' ? 'Ela' : 'Ele', myAv: role === 'a' ? '🐻' : '🐰', otherAv: role === 'a' ? '🐰' : '🐻',
                       quality:'motion', mbps:8, fps:30}, store.get('cfg', {}));
  paintNames(); setSeat('O', 'off'); renderWait();
  store.get('chat', []).forEach(m => addMsg(m.from, m.text, false)); msgs = store.get('chat', []);
  $('dot').classList.remove('on');
  start();
}
if (role) boot();
else{
  $('who').classList.add('on');
  $('who').querySelectorAll('button').forEach(b => b.onclick = () => { role = b.dataset.r; store.set('role', role); $('who').classList.remove('on'); boot(); });
}
</script>
