<section class="assistidos-admin">

    <div class="pagina-cabecalho">

        <div>
            <h2>Coisas que já assistimos</h2>

            <p>
                Gerencie filmes, séries, animes e nossa lista
                de coisas que ainda queremos assistir.
            </p>
        </div>

        <div class="assistidos-acoes-topo">

            <button
                type="button"
                class="botao-principal"
                id="assistidos-novo"
            >
                + Adicionar
            </button>

            <button
                type="button"
                class="botao-sincronizar"
                id="assistidos-sincronizar"
            >
                🔄 Sincronizar com o site
            </button>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- STATUS -->
    <!-- ================================================= -->

    <div
        id="assistidos-status"
        class="assistidos-status"
    ></div>


    <!-- ================================================= -->
    <!-- LISTA -->
    <!-- ================================================= -->

    <div
        id="assistidos-lista"
        class="assistidos-admin-lista"
    ></div>


    <!-- ================================================= -->
    <!-- MODAL -->
    <!-- ================================================= -->

    <div
        id="assistidos-modal"
        class="assistidos-admin-modal oculto"
    >

        <div class="assistidos-modal-caixa">

            <div class="assistidos-modal-cabecalho">

                <div>
                    <h3 id="assistidos-modal-titulo">
                        Adicionar
                    </h3>

                    <p>
                        Preencha as informações abaixo.
                    </p>
                </div>

                <button
                    type="button"
                    id="assistidos-modal-fechar"
                    class="assistidos-modal-fechar"
                >
                    ×
                </button>

            </div>


            <form id="assistidos-form">

                <input
                    type="hidden"
                    id="assistidos-id"
                >


                <!-- CAPA -->

                <div class="assistidos-form-capa">

                    <div
                        id="assistidos-preview"
                        class="assistidos-preview"
                    >
                        🎬
                    </div>

                    <div>

                        <label>
                            Capa
                        </label>

                        <input
                            type="file"
                            id="assistidos-imagem"
                            accept="image/*"
                        >

                        <small>
                            JPG, PNG ou WEBP.
                        </small>

                    </div>

                </div>


                <!-- TÍTULO -->

                <div class="campo">

                    <label for="assistidos-titulo">
                        Título
                    </label>

                    <input
                        type="text"
                        id="assistidos-titulo"
                        placeholder="Ex.: Interestelar"
                        required
                    >

                </div>


                <!-- CATEGORIA -->

                <div class="campo">

                    <label for="assistidos-categoria">
                        Categoria
                    </label>

                    <select
                        id="assistidos-categoria"
                        required
                    >

                        <option value="filmes">
                            🎬 Filme
                        </option>

                        <option value="series">
                            📺 Série
                        </option>

                        <option value="animes">
                            🍿 Anime
                        </option>

                        <option value="queremos">
                            ⏳ Ainda queremos assistir
                        </option>

                    </select>

                </div>

<!-- STATUS (assistido / assistindo) -->

<div
    id="assistidos-status-area"
    class="campo"
>

    <label for="assistidos-item-status">
        Status
    </label>

    <select id="assistidos-item-status">

        <option value="assistido">
            ✓ Já assistimos
        </option>

        <option value="assistindo">
            ▶ Assistindo agora
        </option>

                <option value="concluido">
            ✔ Concluído (acabou, nada a mais)
        </option>

    </select>

</div>

<!-- PROGRESSO — FILME -->

<div
    id="assistidos-progresso-filme"
    class="assistidos-notas-area"
>

    <div class="campo">
        <label for="assistidos-minuto-atual">
            Onde você parou (hh:mm:ss)
        </label>
        <input
            type="text"
            id="assistidos-minuto-atual"
            placeholder="Ex.: 45:00 ou 1:12:30"
        >
    </div>

    <div class="campo">
        <label for="assistidos-duracao-total">
            Duração total (hh:mm:ss)
        </label>
        <input
            type="text"
            id="assistidos-duracao-total"
            placeholder="Ex.: 2:00:00"
        >
    </div>

</div>


<!-- PROGRESSO — SÉRIE / ANIME -->

<div
    id="assistidos-progresso-serie"
    class="assistidos-notas-area"
>

    <div class="campo">
        <label for="assistidos-temporada">
            Temporada atual
        </label>
        <input type="number" id="assistidos-temporada" min="1" placeholder="Ex.: 2">
    </div>

    <div class="campo">
        <label for="assistidos-episodio">
            Episódio atual
        </label>
        <input type="number" id="assistidos-episodio" min="1" placeholder="Ex.: 6">
    </div>

    <div class="campo">
        <label for="assistidos-minuto-episodio">
            Onde você parou nesse episódio (hh:mm:ss)
        </label>
        <input type="text" id="assistidos-minuto-episodio" placeholder="Ex.: 12:30">
    </div>

    <div class="campo">
        <label for="assistidos-duracao-episodio">
            Duração do episódio (hh:mm:ss)
        </label>
        <input type="text" id="assistidos-duracao-episodio" placeholder="Ex.: 24:00">
    </div>

</div>

 

                                <!-- ANO -->

                <div class="campo">

                    <label for="assistidos-ano">
                        Ano de lançamento
                    </label>

                    <input
                        type="number"
                        id="assistidos-ano"
                        placeholder="2026"
                        min="1800"
                        max="2100"
                    >

                </div>


                <!-- ANO EM QUE ASSISTIMOS -->

                <div class="campo" id="assistidos-ano-assistido-area">

                    <label for="assistidos-ano-assistido">
                        Ano em que assistimos
                    </label>

                    <input
                        type="number"
                        id="assistidos-ano-assistido"
                        placeholder="2026"
                        min="1900"
                        max="2100"
                    >

                </div>


                <!-- NOTAS -->


                <!-- NOTAS -->

                <div
                    id="assistidos-notas-area"
                    class="assistidos-notas-area"
                >

                    <div class="campo">

                        <label for="assistidos-nota-eu">
                            Minha avaliação
                        </label>

                        <input
                            type="number"
                            id="assistidos-nota-eu"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="0 a 10"
                        >

                    </div>


                    <div class="campo">

                        <label for="assistidos-nota-ela">
                            Avaliação dela
                        </label>

                        <input
                            type="number"
                            id="assistidos-nota-ela"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="0 a 10"
                        >

                    </div>

                </div>

                                <!-- AINDA QUEREMOS: tipo, preview em texto e links -->

                <div id="assistidos-queremos-area" style="display:none;">

                    <div class="campo">
                        <label for="assistidos-tipo">É um(a)...</label>
                        <select id="assistidos-tipo">
                            <option value="">Escolha...</option>
                            <option value="filmes">🎬 Filme</option>
                            <option value="series">📺 Série</option>
                            <option value="animes">🍿 Anime</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="assistidos-preview-texto">
                            Preview (resumo, sinopse, o que chamou a atenção)
                        </label>
                        <textarea
                            id="assistidos-preview-texto"
                            rows="6"
                            placeholder="Cole aqui um resumo ou escreva um textinho..."
                        ></textarea>
                    </div>

                    <div class="campo">
                        <label>Links (trailer, onde assistir, etc.)</label>
                        <div id="assistidos-links-lista"></div>
                        <button type="button" id="assistidos-links-add" class="botao-secundario">
                            + Adicionar link
                        </button>
                    </div>

                </div>

                
                <!-- TEMPORADAS (séries e animes) -->

                <div id="assistidos-temporadas-area" class="assistidos-notas-area">

                    <div class="campo">
                        <label for="assistidos-temp-assistida">
                            Última temporada que assistimos
                        </label>
                        <input type="number" id="assistidos-temp-assistida" min="1" placeholder="Ex.: 2">
                    </div>

                    <div class="campo">
                        <label for="assistidos-temp-total">
                            Temporadas lançadas (opcional)
                        </label>
                        <input type="number" id="assistidos-temp-total" min="1" placeholder="Ex.: 3">
                    </div>

                </div>
                <!-- COR DO FUNDO DO CARD -->

                <div class="campo" id="assistidos-aura-area">

                    <label for="assistidos-aura">
                        Cor do fundo ao abrir o card
                    </label>

                    <select id="assistidos-aura">
                        <option value="auto">✨ Automática (pela capa)</option>
                        <option value="branca">🤍 Branca prateada</option>
                        <option value="cor">🎨 Escolher cor</option>
                    </select>

                    <input
                        type="color"
                        id="assistidos-aura-cor"
                        value="#c9a7f5"
                        style="display:none; margin-top:8px; width:70px; height:38px;"
                    >

                                        <div
                        id="assistidos-aura-sugestoes"
                        style="display:none; margin-top:10px; gap:8px; flex-wrap:wrap; align-items:center;"
                    ></div>

                </div>
                <!-- MEMÓRIA -->

                <div class="campo">

                    <label for="assistidos-memoria">
                        Nossa memória
                    </label>

                    <textarea
                        id="assistidos-memoria"
                        rows="4"
                        placeholder="Alguma coisa que você queira guardar sobre esse filme..."
                    ></textarea>

                </div>


                <!-- BOTÕES -->

                <div class="assistidos-form-acoes">

                    <button
                        type="button"
                        id="assistidos-cancelar"
                        class="botao-secundario"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="botao-principal"
                    >
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>
